name: Build Centtrix

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm python3 xorriso isolinux syslinux-common \
            gcc rustc pkg-config libgtk-3-dev curl

      - name: Build the image
        run: ./build.sh

      - name: Build the ISO
        run: ./build.sh iso

      - name: Build the writer AppImage
        run: sh tools/makeappimage.sh

      - name: Collect files
        run: |
          mkdir -p dist
          cp centtrix.img dist/centtrix.img
          cp Centtrix-4.0.iso dist/Centtrix-4.0.iso
          cp Centtrix-Writer-x86_64.AppImage dist/
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: centtrix
          path: dist/*

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/centtrix.img
            dist/Centtrix-4.0.iso
            dist/Centtrix-Writer-x86_64.AppImage
